name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check release source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "$TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run tests
        run: swift test
      - name: Build the app
        run: Scripts/make-app.sh
      - name: Zip the app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --keepParent build/Dogear.app "Dogear-$TAG.zip"
          shasum -a 256 "Dogear-$TAG.zip" > "Dogear-$TAG.zip.sha256"
      - name: Attest the app
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Dogear-${{ github.ref_name }}.zip
      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            Dogear-*.zip
            Dogear-*.zip.sha256
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
