name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run tests
        run: swift test
      - name: Build the app
        run: Scripts/make-app.sh
      - name: Check the tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "$TAG"
      - name: Zip the app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --keepParent build/Dogear.app "Dogear-$TAG.zip"
          shasum -a 256 "Dogear-$TAG.zip" > "Dogear-$TAG.zip.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Dogear-*.zip
      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            Dogear-*.zip
            Dogear-*.zip.sha256
          overwrite_files: false
          generate_release_notes: true
